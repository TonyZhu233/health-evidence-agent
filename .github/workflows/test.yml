name: Reproducible offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python agent.py --output runs/ci-demo
      - run: python evaluate.py --output runs/ci-evaluation
      - run: python verify_artifacts.py runs/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.os }}-${{ matrix.python }}
          path: |
            runs/ci-demo
            runs/ci-evaluation
          retention-days: 14
